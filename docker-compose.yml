services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: devops-notes-backend
    hostname: backend
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8000:8080"
    environment:
      - FIRESTORE_DB_NAME=${FIRESTORE_DB_NAME:-devops-notes-db}
      - PORT=8080
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/keys.json
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    volumes:
      - type: bind
        source: ${HOME}/.config/gcloud/application_default_credentials.json
        target: /tmp/keys.json
        read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    networks:
      - devops-notes-network
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # read_only removed for local dev — Google auth may need to write token cache
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: devops-notes-frontend
    hostname: frontend
    restart: unless-stopped
    read_only: true
    user: "101:101"
    ports:
      - "5173:8080"
    environment:
      - PORT=8080
    env_file:
      - .env
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /var/cache/nginx:noexec,nosuid,size=50m
      - /var/run:noexec,nosuid,size=10m
    networks:
      - devops-notes-network
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost:8080/health || curl -sf http://localhost:8080/health > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

networks:
  devops-notes-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
